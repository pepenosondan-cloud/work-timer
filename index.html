<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121826"><title>仕事時間タイマー</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#121826;color:#f5f7fb;display:flex;justify-content:center;padding:24px 12px}.app{width:min(100%,480px)}h1{font-size:20px;margin:8px 0 22px}.panel{background:#1d2738;border:1px solid #344154;border-radius:18px;padding:22px;margin-bottom:14px}.eyebrow{color:#b7c5d9;font-size:13px}.time{font-variant-numeric:tabular-nums;letter-spacing:1px;font-size:clamp(42px,11vw,58px);font-weight:700;margin:8px 0 18px}.row{display:flex;gap:9px}.btn{border:0;border-radius:12px;padding:13px 12px;font-size:15px;font-weight:700;flex:1;cursor:pointer}.primary{background:#7cacf8;color:#102039}.secondary{background:#334359;color:white}.danger{background:#633741;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.total{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0}.hint{color:#aab9cb;font-size:13px;line-height:1.65}.entries{padding-left:20px;color:#d7e0ed;font-size:14px}.entries li{margin:7px 0}a{color:#a8caff}.status{font-size:13px;color:#b9c7da;margin:12px 0 0}.small{font-size:12px;color:#aab9cb}.footer{display:flex;gap:10px;flex-wrap:wrap}.footer button{font-size:13px;border:1px solid #485b72;border-radius:9px;background:transparent;color:#dce6f5;padding:9px 12px}.goal-input{width:105px;background:#121826;border:1px solid #64748b;border-radius:9px;padding:9px;color:white;font-size:16px}.goal-number{font-size:clamp(34px,9vw,48px);font-weight:750;font-variant-numeric:tabular-nums;margin:8px 0}.progress{height:9px;border-radius:9px;background:#344154;overflow:hidden;margin:14px 0 8px}.progress>div{height:100%;background:#7cacf8;width:0%;transition:width .3s}.goal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.goal-sub{font-size:13px;color:#b7c5d9} .app{width:min(100%,520px)}body{padding:10px 8px}h1{font-size:16px;margin:2px 0 10px}.panel{padding:14px;margin-bottom:9px;border-radius:13px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{min-width:0}.metric .eyebrow{font-size:11px}.metric .time,.metric .total{font-size:clamp(19px,5.5vw,30px);letter-spacing:-.6px;margin:8px 0;font-weight:750;white-space:nowrap}.controls{display:flex;gap:10px;margin-top:10px}.controls .btn{display:grid;place-items:center;min-height:44px;padding:9px}.controls svg{width:21px;height:21px;fill:currentColor}.controls .pause-icon{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}.status{margin:8px 0 0}.goal-number{font-size:clamp(30px,8vw,43px)}.goal-head{flex-wrap:wrap}.goal-input{width:80px;padding:6px;font-size:14px}.progress{margin:9px 0 6px}.entries{margin:9px 0}.footer button{padding:7px 9px;font-size:12px}.footer{gap:6px}.goal-sub{font-size:12px}</style><style>body{padding:4px 6px}.panel{padding:10px 12px;margin-bottom:5px;border-radius:12px}.metric .time,.metric .total{margin:0;font-size:clamp(19px,5.5vw,30px)}.controls{margin-top:8px;gap:8px}.controls .btn{min-height:34px;padding:5px}.controls svg{height:18px;width:18px}.status{font-size:11px;margin:4px 0 0}.goal-head{flex-wrap:nowrap}.goal-head .eyebrow{white-space:nowrap}.goal-sub{font-size:11px}.goal-input{width:58px;padding:3px;font-size:13px}.goal-number{font-size:clamp(23px,6vw,32px);margin:3px 0}.progress{margin:5px 0 3px;height:6px}.history{padding:7px 12px}.history summary{cursor:pointer;color:#aab9cb;font-size:11px}.history[open]{padding-bottom:12px}</style></head><body><main class="app"><section class="panel"><div class="metrics"><div class="metric"><div id="clock" class="time">00:00:00</div></div><div class="metric"><div id="today" class="total">00:00:00</div></div></div><div class="controls"><button id="start" class="btn primary" aria-label="開始・再開" title="開始・再開"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button><button id="pause" class="btn secondary" disabled aria-label="一時停止" title="一時停止"><svg viewBox="0 0 24 24" class="pause-icon" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button><button id="finish" class="btn danger" disabled aria-label="終了・記録" title="終了・記録"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button></div><div id="status" class="status" aria-live="polite">待機中</div><div id="date" class="small" hidden></div></section><section class="panel"><div class="goal-head"><div class="eyebrow" id="month-label">月間残り</div><label class="goal-sub">目標 <input id="goal" class="goal-input" type="number" min="0" max="744" step="0.5" inputmode="decimal" placeholder="時間"> 時間</label></div><div id="remaining" class="goal-number">--:--:--</div><div class="progress"><div id="goal-progress"></div></div><div class="goal-sub" id="month-progress"></div></section><details class="panel history"><summary>記録・出力</summary><ol id="entries" class="entries"></ol><div class="footer"><button id="copy">合計をコピー</button><button id="csv">CSV出力</button><button id="clear">今日の記録を削除</button></div></details></main><script>
(()=>{'use strict';const KEY='worktimer-v1';const $=id=>document.getElementById(id);const fmt=ms=>{const s=Math.floor(Math.max(0,ms)/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};const day=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let data;try{data=JSON.parse(localStorage.getItem(KEY))||{entries:[],session:null}}catch{data={entries:[],session:null}};if(!Array.isArray(data.entries))data.entries=[];if(!data.goals||typeof data.goals!=='object')data.goals={};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('保存できません',e)}};const month=t=>day(t).slice(0,7);const monthDuration=(a,b,which)=>{let total=0;while(a<b){const d=new Date(a);const next=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();const stop=Math.min(next,b);if(month(a)===which)total+=duration(a,stop);a=stop}return total};const duration=(a,b)=>Math.max(0,b-a);function segmentDay(a,b,which){let total=0;while(a<b){const d=new Date(a);const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();const stop=Math.min(next,b);if(day(a)===which)total+=duration(a,stop);a=stop}return total}function intervals(now){const e=data.entries.map(x=>[x.start,x.end]);const s=data.session;if(s){for(const x of s.parts||[])e.push(x);if(s.runningFrom!==null)e.push([s.runningFrom,now])}return e}function render(){const now=Date.now(),s=data.session;let active=0;if(s){for(const [a,b] of s.parts||[])active+=duration(a,b);if(s.runningFrom!==null)active+=duration(s.runningFrom,now)}$('clock').textContent=fmt(active);const today=day(now);$('date').textContent=today;let total=0;for(const [a,b] of intervals(now))total+=segmentDay(a,b,today);$('today').textContent=fmt(total);const thisMonth=month(now);if($('goal').dataset.month!==thisMonth){$('goal').dataset.month=thisMonth;$('goal').value=data.goals[thisMonth]??''}const goalHours=Number(data.goals[thisMonth]||0);let monthMs=0;for(const [a,b] of intervals(now))monthMs+=monthDuration(a,b,thisMonth);$('month-label').textContent='月間残り';const remaining=Math.max(0,goalHours*3600000-monthMs);$('remaining').textContent=goalHours>0?fmt(remaining):'--:--:--';$('goal-progress').style.width=goalHours>0?Math.min(100,monthMs/(goalHours*3600000)*100)+'%':'0%';$('month-progress').textContent=goalHours>0?`今月の実績 ${fmt(monthMs)} / 目標 ${goalHours}時間（${Math.floor(monthMs/(goalHours*3600000)*100)}%）${remaining===0?' ・目標達成！':''}`:'目標未設定';$('start').setAttribute('aria-label',s?'再開':'開始');$('start').title=s?'再開':'開始';$('start').disabled=!!s&&s.runningFrom!==null;$('pause').disabled=!s||s.runningFrom===null;$('finish').disabled=!s;$('status').textContent=!s?'待機中':s.runningFrom!==null?'● 計測中':'Ⅱ 一時停止中';const items=data.entries.filter(e=>e.end>e.start&&segmentDay(e.start,e.end,today)>0);$('entries').replaceChildren();if(!items.length){const li=document.createElement('li');li.textContent='まだ記録がありません';$('entries').append(li)}else for(const e of items){const li=document.createElement('li');const a=new Date(e.start),b=new Date(e.end);li.textContent=`${a.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}〜${b.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}（${fmt(segmentDay(e.start,e.end,today))}）`;$('entries').append(li)}}$('goal').addEventListener('change',()=>{const m=month(Date.now()),v=Number($('goal').value);if(!Number.isFinite(v)||v<0||v>744){alert('0〜744時間で入力してください');return}if(v===0||$('goal').value==='')delete data.goals[m];else data.goals[m]=v;save();render()});$('start').onclick=()=>{if(!data.session)data.session={parts:[],runningFrom:Date.now()};else if(data.session.runningFrom===null)data.session.runningFrom=Date.now();save();render()};$('pause').onclick=()=>{const s=data.session;if(!s||s.runningFrom===null)return;s.parts.push([s.runningFrom,Date.now()]);s.runningFrom=null;save();render()};$('finish').onclick=()=>{const s=data.session;if(!s)return;if(s.runningFrom!==null)s.parts.push([s.runningFrom,Date.now()]);for(const [start,end] of s.parts)if(end>start)data.entries.push({start,end});data.session=null;save();render()};$('copy').onclick=async()=>{const str=`${$('date').textContent} 仕事時間：${$('today').textContent}`;try{await navigator.clipboard.writeText(str);$('status').textContent='今日の合計をコピーしました'}catch{prompt('以下をコピーしてください',str)}};$('csv').onclick=()=>{const lines=['日付,開始,終了,秒数'];for(const e of data.entries){let a=e.start;while(a<e.end){const d=new Date(a),next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),b=Math.min(next,e.end);lines.push(`${day(a)},${new Date(a).toLocaleString('ja-JP')},${new Date(b).toLocaleString('ja-JP')},${Math.floor((b-a)/1000)}`);a=b}}const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='work_time.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('clear').onclick=()=>{if(!confirm('今日に該当する記録を削除しますか？（計測中の時間は削除しません）'))return;const today=day(Date.now());data.entries=data.entries.flatMap(e=>{let a=e.start,out=[];while(a<e.end){const d=new Date(a),next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),b=Math.min(next,e.end);if(day(a)!==today)out.push({start:a,end:b});a=b}return out});save();render()};render();setInterval(render,1000);document.addEventListener('visibilitychange',render)})();
</script></body></html>
